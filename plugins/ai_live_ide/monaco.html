<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Monaco Editor — Scrapelio AI Live IDE</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1A1A1A;
    color: #F0F0F0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #status {
    position: absolute;
    top: 8px;
    right: 12px;
    z-index: 1000;
    font-size: 11px;
    color: #A0A0A0;
    background: rgba(0, 0, 0, 0.55);
    padding: 4px 10px;
    border-radius: 4px;
    pointer-events: none;
    transition: opacity .25s ease;
    opacity: 0;
  }
  #status.visible { opacity: 1; }
  #editor {
    position: absolute;
    inset: 0;
  }
  #fallback {
    position: absolute;
    inset: 0;
    display: none;
    padding: 16px;
    box-sizing: border-box;
    background: #1A1A1A;
    color: #F0F0F0;
    font-family: "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    border: none;
    outline: none;
    resize: none;
    white-space: pre;
    overflow: auto;
  }
  .loader {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #A0A0A0;
    font-size: 12px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="status">Cargando…</div>
<div id="editor"></div>
<textarea id="fallback" spellcheck="false"></textarea>
<div id="loader" class="loader">Inicializando editor…</div>

<script>
  // ───────────────────────────────────────────────────────────────────────────
  // Scrapelio AI Live IDE — bridge JS/Python
  //
  // Expone:
  //   window.editorAPI.getValue()
  //   window.editorAPI.setValue(text)
  //   window.editorAPI.setLanguage(langId)
  //   window.editorAPI.setTheme(themeName)   // 'vs-dark' | 'vs' | 'hc-black'
  //   window.editorAPI.setReadOnly(bool)
  //   window.editorAPI.getLanguage()
  //
  // Eventos:
  //   window.scrapelioOnChange  ← Python conecta este callback (vía runJavaScript)
  // ───────────────────────────────────────────────────────────────────────────

  const STATUS_EL  = document.getElementById('status');
  const LOADER_EL  = document.getElementById('loader');
  const EDITOR_EL  = document.getElementById('editor');
  const FALLBACK_EL = document.getElementById('fallback');

  function showStatus(text, durationMs) {
    STATUS_EL.textContent = text;
    STATUS_EL.classList.add('visible');
    if (durationMs && durationMs > 0) {
      setTimeout(() => STATUS_EL.classList.remove('visible'), durationMs);
    }
  }

  // Detección automática de lenguaje por extensión de fichero
  const EXT_TO_LANG = {
    'html': 'html', 'htm': 'html',
    'css': 'css', 'scss': 'scss', 'less': 'less',
    'js': 'javascript', 'mjs': 'javascript', 'cjs': 'javascript',
    'jsx': 'javascript',
    'ts': 'typescript', 'tsx': 'typescript',
    'json': 'json',
    'py': 'python', 'pyw': 'python',
    'md': 'markdown', 'markdown': 'markdown',
    'yml': 'yaml', 'yaml': 'yaml',
    'xml': 'xml', 'svg': 'xml',
    'sql': 'sql',
    'sh': 'shell', 'bash': 'shell', 'zsh': 'shell',
    'go': 'go',
    'rs': 'rust',
    'java': 'java',
    'c': 'c', 'h': 'c',
    'cpp': 'cpp', 'cxx': 'cpp', 'cc': 'cpp', 'hpp': 'cpp',
    'cs': 'csharp',
    'rb': 'ruby',
    'php': 'php',
    'kt': 'kotlin',
    'swift': 'swift',
    'vue': 'html',
    'txt': 'plaintext'
  };

  function detectLanguageFromName(filename) {
    if (!filename) return 'plaintext';
    const dot = filename.lastIndexOf('.');
    if (dot < 0) return 'plaintext';
    const ext = filename.slice(dot + 1).toLowerCase();
    return EXT_TO_LANG[ext] || 'plaintext';
  }

  // ── Fallback editor (textarea) si Monaco no puede cargarse ───────────────
  function activateFallback(initialValue) {
    EDITOR_EL.style.display = 'none';
    LOADER_EL.style.display = 'none';
    FALLBACK_EL.style.display = 'block';
    FALLBACK_EL.value = initialValue || '';
    FALLBACK_EL.addEventListener('input', () => {
      if (typeof window.scrapelioOnChange === 'function') {
        try { window.scrapelioOnChange(FALLBACK_EL.value); } catch (_) {}
      }
    });

    window.editorAPI = {
      getValue: () => FALLBACK_EL.value,
      setValue: (text) => { FALLBACK_EL.value = text || ''; },
      setLanguage: () => {},
      setTheme: () => {},
      setReadOnly: (ro) => { FALLBACK_EL.readOnly = !!ro; },
      getLanguage: () => 'plaintext',
      detectLanguageFromName: detectLanguageFromName,
      isFallback: true
    };
    // Avisar a Python (title-bridge) que editorAPI ya existe — distinto de
    // loadFinished de QWebEngine, que ocurre antes de instanciar Monaco/CDN.
    document.title = '__SCRAPELIO_EDITOR_READY__' + Date.now();
    showStatus('Editor minimalista (CDN no disponible)', 4000);
  }

  // ── Carga de Monaco vía CDN ──────────────────────────────────────────────
  function loadMonaco() {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.min.js';
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('Monaco loader script not reachable'));
      document.head.appendChild(script);

      // Timeout de seguridad — si en 8s no carga, fallback
      setTimeout(() => {
        if (!window.require) reject(new Error('Monaco loader timeout'));
      }, 8000);
    });
  }

  let monacoEditor = null;
  let currentLanguage = 'plaintext';

  loadMonaco().then(() => {
    window.require.config({
      paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }
    });

    window.require(['vs/editor/editor.main'], () => {
      monaco.editor.defineTheme('scrapelio-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: {
          'editor.background':           '#1A1A1A',
          'editor.foreground':           '#F0F0F0',
          'editorLineNumber.foreground': '#606060',
          'editor.selectionBackground':  '#264F78',
          'editor.lineHighlightBackground': '#222222',
          'editorCursor.foreground':     '#4B9EFF',
          'editorIndentGuide.background': '#2A2A2A'
        }
      });

      monacoEditor = monaco.editor.create(EDITOR_EL, {
        value: '',
        language: 'plaintext',
        theme: 'scrapelio-dark',
        automaticLayout: true,
        fontFamily: '"JetBrains Mono", Menlo, Consolas, "Courier New", monospace',
        fontSize: 13,
        lineHeight: 20,
        minimap: { enabled: true, scale: 1 },
        scrollBeyondLastLine: false,
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        renderWhitespace: 'selection',
        tabSize: 4,
        insertSpaces: true,
        wordWrap: 'off',
        bracketPairColorization: { enabled: true },
        formatOnPaste: false,
        renderLineHighlight: 'line',
        contextmenu: true
      });

      monacoEditor.onDidChangeModelContent(() => {
        if (typeof window.scrapelioOnChange === 'function') {
          try { window.scrapelioOnChange(monacoEditor.getValue()); } catch (_) {}
        }
      });

      window.editorAPI = {
        getValue: () => monacoEditor.getValue(),
        setValue: (text) => {
          const model = monacoEditor.getModel();
          const newText = (text === null || text === undefined) ? '' : String(text);
          if (!model) {
            monacoEditor.setValue(newText);
            return;
          }
          if (model.getValue() === newText) return;
          monacoEditor.executeEdits('scrapelio-ai', [{
            range: model.getFullModelRange(),
            text: newText,
            forceMoveMarkers: true
          }]);
          monacoEditor.pushUndoStop();
        },
        setLanguage: (langId) => {
          if (!langId) langId = 'plaintext';
          currentLanguage = langId;
          const model = monacoEditor.getModel();
          if (model) monaco.editor.setModelLanguage(model, langId);
        },
        getLanguage: () => currentLanguage,
        setTheme: (themeName) => {
          monaco.editor.setTheme(themeName || 'scrapelio-dark');
        },
        setReadOnly: (ro) => monacoEditor.updateOptions({ readOnly: !!ro }),
        detectLanguageFromName: detectLanguageFromName,
        isFallback: false
      };

      LOADER_EL.style.display = 'none';
      document.title = '__SCRAPELIO_EDITOR_READY__' + Date.now();
      showStatus('Editor listo', 1500);
    });
  }).catch((err) => {
    console.warn('[AI Live IDE] Monaco no disponible:', err);
    activateFallback('');
  });
</script>
</body>
</html>
